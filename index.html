    <script>
      (function () {
        window.__deferredPrompt = window.__deferredPrompt || null;
        window.__dramawinInstallPrompt = window.__dramawinInstallPrompt || null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__deferredPrompt = e;
          window.__dramawinInstallPrompt = e;
          window.dispatchEvent(new Event('dramawin-pwa-prompt-ready'));
        });
        window.addEventListener('appinstalled', function () {
          window.__deferredPrompt = null;
          window.__dramawinInstallPrompt = null;
          window.dispatchEvent(new Event('dramawin-pwa-installed'));
        });
      })();
